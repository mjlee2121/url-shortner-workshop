# PostgreSQL + Redis for Milestones 3-5:   docker compose up -d db redis
# Milestone 6 adds the API itself as a third service.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: urldb
    ports:
      - "5432:5432"   # exposed so tests on your machine can reach it
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro   # creates urldb_test on first start
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d urldb"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    # Milestone 5 question: why volatile-lru and not allkeys-lru?
    # (Which of our keys have a TTL, and which one must never be evicted?)
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "volatile-lru"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # TODO(M6): add an `api` service:
  #   build: .
  #   ports 8000:8000
  #   environment: DATABASE_URL and REDIS_URL pointing at the service NAMES "db" and "redis"
  #     (not localhost: why?), plus BASE_URL
  #   depends_on db and redis with condition: service_healthy (why not just depends_on: [db]?)

volumes:
  pgdata:
